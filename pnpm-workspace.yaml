packages:
  - packages/*
  - apps/*
overrides:
  # GHSA-mh99-v99m-4gvg: unbounded brace expansion crashes the process (DoS).
  # Scoped to the 5.x line, which is the only one the advisory affects and the
  # only one that resolves here (eslint's minimatch@10). Dev-only, never shipped.
  brace-expansion@5: '>=5.0.8'
  # GHSA-7p8r-x3mc-p8w7: a backslash authority introducer lets a crafted URI
  # parse to an unexpected host (host confusion). Reached only through ajv, via
  # commitlint's config validator and the docs' YAML language server, so it is
  # dev-only and never shipped. Scoped to 3.x — the only line that resolves
  # here — so a future 4.x arrival is re-audited rather than silently allowed.
  # The upper bound is load-bearing: the replacement side is a range, not just
  # a floor, so a bare '>=3.1.5' resolves to the newest 4.x and silently pushes
  # ajv across a major.
  fast-uri@3: '>=3.1.5 <4'
  # GHSA-5p4m-2wfm-xmqj: quadratic CPU consumption resolving !!omap (DoS on
  # untrusted YAML). Both major lines resolve here and both are vulnerable, so
  # each needs its own entry — the 3.x fix was not backported below 3.15.1.
  # 3.x arrives via changesets > @manypkg/get-packages > read-yaml-file; 4.x via
  # changesets' own parser and commitlint's cosmiconfig. Dev-only, never
  # shipped, and none of it parses YAML from outside the repo.
  # The upper bounds are load-bearing for the same reason as fast-uri above:
  # js-yaml 5.x exists, so a bare '>=4.3.1' would drag both lines across a major
  # that these dependents do not declare support for.
  js-yaml@3: '>=3.15.1 <4'
  js-yaml@4: '>=4.3.1 <5'
  # GHSA-2v37-7h3g-55p8: a custom alphabet with size zero loops forever (DoS).
  # Only the 3.x line is affected — 5.1.16 and 6.0.0 also resolve here and both
  # sit outside the advisory's `<3.3.18` range — so one scoped entry covers it
  # and a future 4.x arrival is re-audited rather than silently allowed. Every
  # path runs through postcss (eslint-plugin-astro, next, vite), so it is build
  # tooling, never shipped, and nothing here calls nanoid with a custom
  # generator at all. Upper bound load-bearing as above.
  #
  # The floor was 3.3.17, which is where the advisory's patched range started
  # when this entry was written. Upstream has since widened it to `<3.3.18`, so
  # the pin that fixed this went stale without any file here changing and the
  # gate went red on a commit that touched only .github/. That is exactly what
  # `audit:check` is deliberately not a Turbo task for: a cached pass would have
  # replayed over it and shipped.
  nanoid@3: '>=3.3.18 <4'
#
# No `auditConfig.ignoreGhsas`. The single entry that lived here suppressed
# GHSA-mh99-v99m-4gvg for one unfixable copy reached through
# apps/docs > @docusaurus/core > serve-handler > minimatch@3 > brace-expansion@1.
# The Starlight migration removed @docusaurus/core, so that path no longer
# exists — `pnpm why minimatch` now shows only 10.2.5 — and the suppression was
# covering nothing while still being able to hide a future advisory. The
# `serialize-javascript` and `uuid` overrides went with it: both existed for
# Docusaurus's webpack plugins and its sockjs dev server, and neither package
# resolves in the tree at all any more.
allowBuilds:
  core-js: false
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@vitejs/plugin-react@6.0.4'
  # Reviewed dependency upgrades requested before the 24-hour quarantine ends.
  # Exact pins keep the exception from applying to later releases.
  - lint-staged@17.2.0
  - tsdown@0.22.14
  - verkit@0.3.0
  - '@rxova/brand'
  - '@mui/core-downloads-tracker@9.3.0'
  - '@mui/material@9.3.0'
  - '@mui/private-theming@9.3.0'
  - '@mui/styled-engine@9.3.0'
  - '@mui/system@9.3.0'
  - '@mui/types@9.3.0'
  - '@mui/utils@9.3.0'
