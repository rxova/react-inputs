packages:
  - packages/*
  - apps/*
overrides:
  # GHSA-mh99-v99m-4gvg: unbounded brace expansion crashes the process (DoS).
  # Scoped to the 5.x line, which is the only one the advisory affects and the
  # only one that resolves here (eslint's minimatch@10). Dev-only, never shipped.
  brace-expansion@5: '>=5.0.8'
  # GHSA-7p8r-x3mc-p8w7: a backslash authority introducer lets a crafted URI
  # parse to an unexpected host (host confusion). Reached only through ajv, via
  # commitlint's config validator and the docs' YAML language server, so it is
  # dev-only and never shipped. Scoped to 3.x — the only line that resolves
  # here — so a future 4.x arrival is re-audited rather than silently allowed.
  # The upper bound is load-bearing: the replacement side is a range, not just
  # a floor, so a bare '>=3.1.5' resolves to the newest 4.x and silently pushes
  # ajv across a major.
  fast-uri@3: '>=3.1.6 <4'
  # GHSA-5p4m-2wfm-xmqj: quadratic CPU consumption resolving !!omap (DoS on
  # untrusted YAML). Both major lines resolve here and both are vulnerable, so
  # each needs its own entry — the 3.x fix was not backported below 3.15.1.
  # 3.x arrives via changesets > @manypkg/get-packages > read-yaml-file; 4.x via
  # changesets' own parser and commitlint's cosmiconfig. Dev-only, never
  # shipped, and none of it parses YAML from outside the repo.
  # The upper bounds are load-bearing for the same reason as fast-uri above:
  # js-yaml 5.x exists, so a bare '>=4.3.1' would drag both lines across a major
  # that these dependents do not declare support for.
  js-yaml@3: '>=3.15.1 <4'
  js-yaml@4: '>=4.3.2 <5'
  # GHSA-2v37-7h3g-55p8: a custom alphabet with size zero loops forever (DoS).
  # Only the 3.x line is affected — 5.1.16 and 6.0.0 also resolve here and both
  # sit outside the advisory's `<3.3.18` range — so one scoped entry covers it
  # and a future 4.x arrival is re-audited rather than silently allowed. Every
  # path runs through postcss (eslint-plugin-astro, next, vite), so it is build
  # tooling, never shipped, and nothing here calls nanoid with a custom
  # generator at all. Upper bound load-bearing as above.
  #
  # The floor was 3.3.17, which is where the advisory's patched range started
  # when this entry was written. Upstream has since widened it to `<3.3.18`, so
  # the pin that fixed this went stale without any file here changing and the
  # gate went red on a commit that touched only .github/. That is exactly what
  # `audit:check` is deliberately not a Turbo task for: a cached pass would have
  # replayed over it and shipped.
  nanoid@3: '>=3.3.18 <4'
  # The same staleness the nanoid note above describes, now on five more
  # packages. `js-yaml@4`'s floor moved from 4.3.1 to 4.3.2 upstream and is
  # bumped in place. The other four had no entry at all: `astro` and `sharp`
  # arrive through the docs site (Starlight, and its image pipeline), `next`
  # through the compat harnesses, and `svgo` under Astro's SVG handling — the
  # tree resolves the 4.x line, which has its own advisory. All of it is build
  # or dev tooling, none ships in a package tarball, and `audit:check` gates
  # on high.
  #
  # Upper bounds load-bearing for the reason given above: a bare floor resolves
  # to the next major and pushes a dependent across it silently.
  astro@7: '>=7.2.8 <8'
  next@16: '>=16.3.3 <17'
  sharp@0.35: '>=0.35.4 <0.36'
  svgo@4: '>=4.1.0 <5'
  # GHSA-jxfw-x594-9x9m: unescaped Unicode line separators in logged request
  # fields let a client forge extra log lines. Reached only through
  # apps/compat-remix > @react-router/serve (directly, and again under
  # @react-router/dev), the server the Remix compat harness runs its Playwright
  # suite against. The app is private, so this is never shipped. No release of
  # @react-router/serve raises its `^1.10.1` floor, so a bump could not fix it.
  # Scoped to 1.x, the only line that resolves here.
  #
  # Upper bound load-bearing as above.
  morgan@1: '>=1.12.0 <2'
  # GHSA-4mjr-xmp4-gh2g: an attacker-controlled `isBuffer` property sends the
  # parser into a denial of service. GHSA-x5fp-wj9c-mxmx: bracket-key comma
  # parsing slips past `arrayLimit`. One entry covers both, since 6.16.0 fixes
  # each. Reached through the same compat-remix server, via
  # @react-router/serve > express (directly, and again under @react-router/express)
  # and express > body-parser. Private, so never shipped. express 5.2.1 and
  # body-parser 2.3.0 are the latest releases, and they declare `^6.14.0` and
  # `^6.15.2`, so neither has a release to bump to. Scoped to 6.x, the only line
  # that resolves here.
  #
  # Upper bound load-bearing as above.
  qs@6: '>=6.16.0 <7'

  # GHSA-9rgm-9g3h-6x36: devalue <5.9.1 can be driven into a denial of service
  # by malformed input to `parse`/`unflatten`; 5.9.2 is the first patched
  # release. Reached only through Astro (and @astrojs/react), which declares `^5.8.1` -- still
  # true of the latest astro -- so no bump here reaches it. Moderate, so
  # `audit:check` does not gate on it, but it is an open Dependabot alert.
  # Closed below 6 so it stays on the line Astro declares. Drop this once Astro
  # depends on >=5.9.2 itself.
  #
  # Upper bound load-bearing as above.
  devalue@5: '>=5.9.2 <6'
#
# No `auditConfig.ignoreGhsas`. The single entry that lived here suppressed
# GHSA-mh99-v99m-4gvg for one unfixable copy reached through
# apps/docs > @docusaurus/core > serve-handler > minimatch@3 > brace-expansion@1.
# The Starlight migration removed @docusaurus/core, so that path no longer
# exists — `pnpm why minimatch` now shows only 10.2.5 — and the suppression was
# covering nothing while still being able to hide a future advisory. The
# `serialize-javascript` and `uuid` overrides went with it: both existed for
# Docusaurus's webpack plugins and its sockjs dev server, and neither package
# resolves in the tree at all any more.
# The form libraries every package tests against import `react` in their type
# declarations without declaring `@types/react`, so TypeScript finds whichever
# copy pnpm hoisted into node_modules/.pnpm/node_modules. That is 19 for the
# whole workspace, including a package whose `test:react-min` has just swapped
# its own `@types/react` to 18. With two copies of `ReactNode` meeting, every
# form component "cannot be used as a JSX component". pnpm 11 happened to
# re-hoist 18 after that `pnpm add`; pnpm 12 does not, and it is not something
# to rely on either way.
#
# An optional peer is the declaration these packages are missing — it is what
# @radix-ui/react-form already ships. Each importer then links its own
# `@types/react` into them, so the React 18 run checks against 18 types
# throughout.
packageExtensions:
  '@tanstack/react-form':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  formik:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  react-final-form:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  react-hook-form:
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
allowBuilds:
  core-js: false
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@vitejs/plugin-react@6.0.4'
  # Reviewed dependency upgrades requested before the 24-hour quarantine ends.
  # Exact pins keep the exception from applying to later releases.
  - lint-staged@17.2.0
  - tsdown@0.22.14
  - verkit@0.3.0
  - '@rxova/brand'
  - '@mui/core-downloads-tracker@9.3.0'
  - '@mui/material@9.3.0'
  - '@mui/private-theming@9.3.0'
  - '@mui/styled-engine@9.3.0'
  - '@mui/system@9.3.0'
  - '@mui/types@9.3.0'
  - '@mui/utils@9.3.0'

# The advisory lookup is the one request whose result is advisory rather than
# required, and pnpm's default schedule -- a 60s fetch timeout and two retries --
# turns a registry outage into four minutes of waiting before it gives up. One
# retry and a short timeout is the right amount of patience for it. These are
# pnpm settings, so they belong here rather than being passed as flags at every
# call site; `.npmrc` would not do, as pnpm reads only npm-compatible settings
# such as `registry` and auth from there.
fetchTimeout: 15000
fetchRetries: 1
fetchRetryMintimeout: 5000
fetchRetryMaxtimeout: 10000
