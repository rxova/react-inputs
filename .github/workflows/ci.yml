name: CI

# The shared jobs are reusable workflows from rxova/shared, called at @main.
# What stays here is the graph — which jobs run, and when — and the jobs only
# this repository has: the browser suites with their coverage gate, the
# Playwright e2e suites and the framework compatibility harnesses. The checks
# are the ones `pnpm run verify` runs, and the pre-push hook runs that end to
# end, so a green push is a green pipeline.
#
# Release is gated on this workflow succeeding for the commit being released,
# so a push to main that skipped CI would never publish.

on:
  push:
    branches: [main]
  pull_request:
    # No `edited`: it fires on body edits as well as title edits, with nothing
    # at the trigger able to tell them apart, and each one would cancel an
    # in-flight run. The title check that genuinely needs `edited` lives in
    # pr-title.yml, where the same edit costs one job under a name nothing
    # requires.
    #
    # `labeled`/`unlabeled` stay: the changeset gate's escape hatch is the
    # `skip-changeset` label, and without them the label lands on a pull request
    # whose checks never re-run. A label event re-runs the whole graph on the
    # same commit and reaches the same `all checks` verdict.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Default to read-only; jobs opt into more where they need it.
permissions:
  contents: read

# Superseded pull request runs are cancelled; main runs always finish, because
# Release reads this workflow's conclusion to decide whether to publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The root of the graph: commitlint over the range, then `check-scope`, whose
  # outputs let a documentation-only or release-bookkeeping range (the changesets
  # version pull request) skip the code jobs.
  commitlint:
    name: commit messages
    uses: rxova/shared/.github/workflows/commit-messages.yml@main

  # Lint, format, workflows, the repository's own checks, the full build (the
  # docs site and the Storybook workshop included) with the size budgets, and
  # typecheck. The docs site is built here, so a range that only touched it
  # (`docs-changed`) runs this job too.
  checks:
    name: lint · format · types · build
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true' || needs.commitlint.outputs.docs-changed == 'true'
    uses: rxova/shared/.github/workflows/repo-checks.yml@main
    with:
      # Every fenced snippet in the READMEs and llms.txt files parses, every
      # llms.txt `## Props` row is a real prop, styling hooks are namespaced,
      # the e2e browser list is installed, and the scripts/ program typechecks.
      extra-command: >-
        pnpm exec turbo run check:snippets check:llms //#typecheck:scripts &&
        pnpm run check:tokens &&
        pnpm run check:browsers
      build-command: pnpm exec turbo run build size

  # The `unit` project of every component package (pure logic, no DOM), the
  # codemod's fixtures and the scripts' tests, on each supported Node. Ubuntu
  # only, as before: the suites that care about the platform are the browser
  # and e2e ones below. Coverage is the browser job's; nothing is uploaded here.
  test:
    name: unit
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/unit-tests.yml@main
    with:
      node-versions: "[22, 24, 26]"
      operating-systems: '["ubuntu-latest"]'
      test-command: pnpm run test:unit
      coverage-node-version: ""

  # Enforces the per-file coverage thresholds, which need the browser project:
  # a new file with thin tests fails here even when a package's average would
  # still pass. Local, because the shared unit job installs no browser.
  browser:
    name: browser + coverage
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: rxova/shared/actions/setup-pnpm@main
      - uses: rxova/shared/actions/turbo-cache@main
      - run: pnpm install --frozen-lockfile
      - uses: rxova/shared/actions/setup-playwright@main
        with:
          browsers: chromium
      - run: pnpm run test:coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: packages/*/coverage
          if-no-files-found: ignore

  supply-chain:
    name: audit · sherif · knip · dedupe
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/supply-chain.yml@main

  # publint and attw, then `rxova-repo-config pack-smoke` for every published
  # package: the real tarball installed into a scratch project and loaded
  # through both module systems, and the codemod's bin run on a fixture.
  package:
    name: package contract
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/package-contract.yml@main

  # The packages declare Node >= 20.19, but pnpm needs >= 22.13 to install, so
  # the floor is exercised against the real tarballs with plain `node`.
  node-floor:
    name: published packages on the engines floor
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/node-floor-smoke.yml@main

  # The peer range allows React 18, but the lockfile only ever installs 19, so
  # without this the minimum supported version is an untested claim. React is
  # pinned at the root as well as in the component packages and demo-kit:
  # @rxova/ts-utils is declared at the root, so its `react` peer resolves
  # there, and pinning only the packages would leave the inlined hooks on 19
  # while the suite renders with 18. The browser project is the suite that
  # renders; the coverage gate is the browser job's.
  react-minimum-version:
    name: react 18 (all nine)
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    uses: rxova/shared/.github/workflows/react-minimum-version.yml@main
    with:
      react-version: 18.3.1
      types-version: 18.3.27
      types-dom-version: 18.3.7
      filters: "@rxova/react-*-input @rxova/demo-kit"
      playwright-browsers: chromium
      # One package at a time: nine browser suites at once is more than a runner
      # holds, and a failure names the package that failed.
      test-command: >-
        pnpm --filter "@rxova/react-*-input" --workspace-concurrency=1
        exec vitest run --project browser
      typecheck-command: pnpm --filter "@rxova/react-*-input" --workspace-concurrency=1 typecheck

  # Each package's Playwright suite against its own demo, in Chromium, Firefox
  # and WebKit. `turbo run e2e` builds each demo (the cached `demo:build` task)
  # and runs three packages at once; unchanged suites replay from cache.
  e2e:
    name: e2e
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: rxova/shared/actions/setup-pnpm@main
      - uses: rxova/shared/actions/turbo-cache@main
      - run: pnpm install --frozen-lockfile
      # The full set, from the one definition contributors use too.
      - uses: rxova/shared/actions/setup-playwright@main
        with:
          install-script: e2e:install
      - run: pnpm run e2e
      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            packages/*/playwright-report
            packages/*/test-results
          if-no-files-found: ignore

  # The components rendered by real Vite, Next.js (App Router SSR + hydration)
  # and React Router apps, each driven by a Playwright smoke spec.
  frameworks:
    name: Vite · Next · Remix compatibility
    needs: [commitlint]
    if: needs.commitlint.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: rxova/shared/actions/setup-pnpm@main
      - uses: rxova/shared/actions/turbo-cache@main
      - run: pnpm install --frozen-lockfile
      - uses: rxova/shared/actions/setup-playwright@main
        with:
          browsers: chromium
      - run: pnpm run test:frameworks
      - name: Upload compatibility reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: framework-compatibility-report
          path: |
            apps/compat-*/playwright-report
            apps/compat-*/test-results
          if-no-files-found: ignore

  # A documentation-only range: formatting, and the snippets in the READMEs.
  docs-checks:
    name: docs checks
    needs: [commitlint]
    if: needs.commitlint.outputs.docs-only == 'true'
    uses: rxova/shared/.github/workflows/docs-checks.yml@main
    with:
      command: pnpm run format:check && pnpm run check:snippets

  # Any change to a file a published package ships needs a changeset — its
  # source, package.json, README.md and llms.txt included — and each changeset
  # names exactly one package (`repoConfig.changeset` in the root package.json:
  # `scope: "shipped"`, `singlePackage: true`). Escape hatches: the
  # `skip-changeset` label, or `[skip-changeset]` in the title.
  changeset:
    name: changeset present
    needs: [commitlint]
    uses: rxova/shared/.github/workflows/changeset-gate.yml@main

  # The one check the org ruleset requires on main. `skipped` passes; `failure`
  # and `cancelled` do not. A job added above has to be added to `needs` here
  # too, or nothing requires it.
  all-checks:
    name: all checks
    if: always()
    needs:
      [
        commitlint,
        checks,
        test,
        browser,
        supply-chain,
        package,
        node-floor,
        react-minimum-version,
        e2e,
        frameworks,
        docs-checks,
        changeset,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: rxova/shared/actions/require-jobs@main
        with:
          needs: ${{ toJSON(needs) }}
