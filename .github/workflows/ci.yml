name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Deliberately neither `edited` nor `labeled`/`unlabeled`. Both fire for
    # reasons that have nothing to do with the diff — `edited` on body edits as
    # well as title edits, with nothing at the trigger able to tell them apart —
    # and with `cancel-in-progress` below, each one killed an in-flight run and
    # started a fresh one. A cancelled job still bills its minute rounded up, so
    # on #67 adding two cross-references to a description cost 21 of them.
    #
    # The two checks that genuinely need those events now have their own
    # workflows, where the same edit costs one job instead of all of them:
    # pr-title.yml for the title, changeset.yml for the `skip-changeset` label.
    types: [opened, synchronize, reopened]

# Default to read-only; jobs opt into more where they need it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The root of the graph: everything else declares `needs: [commitlint]`.
  # Replaces the standalone Commitlint workflow, which billed a full minute of
  # its own and gated nothing — a bad message failed a check that no other job
  # depended on.
  #
  # It runs on push as well as pull_request on purpose. A job that is skipped
  # also skips its dependents, so gating this on `pull_request` alone would
  # silently skip the entire workflow on main — and the alternative, an
  # `if: always() && !failure()` on every other job, is the kind of expression
  # that is wrong in a way nobody notices until something ships unchecked.
  commitlint:
    name: commit messages
    runs-on: ubuntu-latest
    # Every job here carries a ceiling. Nothing in this workflow has ever
    # legitimately come close to one, and a job that hangs bills until somebody
    # notices — six hours, in the worst run across these repos.
    timeout-minutes: 5
    # The component list, read from the packages that declare themselves rather
    # than repeated in every matrix below. A new input used to need an edit in
    # two places here, and forgetting either was silent: the job simply never
    # ran for that package and CI stayed green.
    #
    # Computed here rather than in a job of its own. `discover` did five seconds
    # of work and was billed a whole minute for it, and this job has already
    # checked the repository out.
    outputs:
      # JSON array for `matrix`, space-separated for shell loops. Same source.
      dirs: ${{ steps.list.outputs.dirs }}
      dirs_list: ${{ steps.list.outputs.dirs_list }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Before the install, and deliberately: component-packages.mjs is
      # dependency-free by design, so nothing downstream has to wait on pnpm for
      # a list that is a directory read.
      - id: list
        run: node packages/utils/print-component-packages.mjs | tee -a "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint the branch commits
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

      # The squash-merge subject is the PR *title*, which no commit in the
      # branch contains. The old wagoid action linted commits only, so the one
      # message that actually lands on main was the one nothing checked.
      # Checked here for every push to the branch, and in pr-title.yml for the
      # edit that changes it after CI has already gone green.
      # Passed through the environment, never interpolated into the shell — a
      # title is attacker-controlled text.
      - name: Lint the PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint --verbose

      # On main this is the squashed subject already linted above, plus the
      # changesets `chore: version packages` commit. Cheap, and it is what keeps
      # this job unskippable.
      - name: Lint the pushed commit
        if: github.event_name == 'push'
        run: pnpm exec commitlint --last --verbose

  checks:
    name: lint · format · types · docs
    needs: [commitlint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      # Type-checks every fenced snippet in the root README, each package README
      # and each package llms.txt, so a copy-pasteable example cannot rot into
      # something that does not parse. Invoked through Turbo (a `//#check:docs`
      # root task) so it replays from cache when none of them changed.
      - run: pnpm exec turbo run check:docs
      # The packaged llms.txt files are what a coding agent reads out of
      # node_modules, and nothing else in the repo looks at them — so a prop
      # renamed in types.ts would leave the table describing an API that no
      # longer exists with every other check still green.
      - run: pnpm exec turbo run check:llms
      - run: pnpm run lint
      - run: pnpm run typecheck

  supply-chain:
    name: audit · dedupe
    needs: [commitlint]
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      # Both are in the local pre-push gate too (packages/utils/verify.mjs).
      # Running them here as well is what keeps a stale local checkout from
      # being the only thing between a new advisory and a release.
      #
      # `audit:check` is deliberately not a Turbo task: its verdict depends on
      # the upstream advisory database, which changes without any file here
      # changing, so a cached pass could replay over a fresh CVE.
      - run: pnpm run audit:check
      - run: pnpm run dedupe:check

  pack-smoke:
    name: package contract
    needs: [commitlint]
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:browsers
      - run: pnpm run build
      # publint and attw read the manifest; pack:smoke installs the real
      # tarballs and imports them through both module systems.
      - run: pnpm run check:exports
      - run: pnpm run pack:smoke
      - run: pnpm run size

  test:
    name: unit (node ${{ matrix.node }})
    needs: [commitlint]
    # The changesets version PR only edits version numbers and changelogs, so
    # the source-level suites add no signal on it.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # NOTE: this list and `engines.node` in the packages have diverged.
        # The packages still declare `>=20.19.0`, but Node 20 is no longer
        # exercised here, so that claim is now asserted rather than tested —
        # the thing the previous comment on this block warned against. Close
        # the gap in one of two directions: put 20 back, or raise `engines`
        # to `>=22.13` across the published packages (a breaking change, so
        # a major bump for all eleven).
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      # Install runs on the `setup-pnpm` default rather than the matrix Node.
      # With the floor at 22 every leg now clears pnpm 11's own
      # `engines.node >= 22.13`, so this is no longer load-bearing the way it
      # was when Node 20 was in the matrix and crashed on `node:sqlite`. It is
      # kept because it still pins one install for all three legs, so a leg
      # tests the Node it names rather than whatever resolved the lockfile.
      #
      # Deliberately no turbo-cache: Turbo hashes files and env, not the Node
      # binary, and the cache action keys on `github.job` — the same string for
      # every leg. All three legs would share one cache, so node 26 could
      # replay a result computed under node 22.
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile

      # Then switch to the Node under test and invoke each package's Vitest
      # binary directly. Vitest supports ^20 || ^22 || >=24, so all three legs
      # are within its range.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Confirm the Node under test
        run: node --version
      - name: Unit suites (pure logic, no DOM)
        run: |
          set -e
          for dir in ${{ needs.commitlint.outputs.dirs_list }}; do
            echo "::group::$dir (unit)"
            (cd "packages/$dir" && ./node_modules/.bin/vitest run --project unit)
            echo "::endgroup::"
          done
          echo "::group::codemod"
          (cd packages/codemod && ./node_modules/.bin/vitest run)
          echo "::endgroup::"

  browser:
    name: browser + coverage
    needs: [commitlint]
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile

      # The browser binary is the slow part and only changes when Playwright
      # does, so the cache key is the resolved version.
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium

      # Enforces 95% per file. A new file with thin tests fails here even when
      # a package's average would still pass.
      - run: pnpm run test:coverage
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: packages/*/coverage
          if-no-files-found: ignore

  react-minimum:
    name: react 18 (all nine)
    needs: [commitlint]
    # The peer range allows React 18, but the lockfile only ever installs 19, so
    # without this the minimum supported version is an untested claim. Separate
    # from the `test` matrix because it rewrites the React version, which
    # --frozen-lockfile forbids.
    #
    # One job for all nine, not one job each. As nine it was the single largest
    # line item in this repo's bill: each leg spent roughly 40 of its ~77 seconds
    # on checkout, setup, install and Playwright before it touched a test, and
    # each was billed two whole minutes — 18 minutes to do eleven minutes of
    # work. The loop pays that setup once.
    #
    # The nine are safe to run in one checkout because they are genuinely
    # independent: none of them depends on another, none has a runtime
    # dependency at all, and `react:min:install` is a `pnpm add -D` scoped to a
    # single package's manifest. So each package is measured against React 18
    # with @rxova/demo-kit — the one thing they share — still on 19, which is
    # exactly what the per-package jobs measured.
    #
    # Sequential rather than concurrent, for the reason the matrix gave: the
    # pinned React must not race across the workspace.
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium

      # `::group::` per package so a failure names the one that failed, which is
      # what the per-package job titles used to do.
      - name: Install the minimum supported React and re-run
        run: |
          set -e
          for dir in ${{ needs.commitlint.outputs.dirs_list }}; do
            echo "::group::$dir (react 18)"
            pnpm --filter "@rxova/$dir" test:react-min
            echo "::endgroup::"
          done

  e2e:
    name: e2e
    needs: [commitlint]
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-playwright

      # `turbo run e2e` builds each package's demo (the cached `demo:build`
      # task) and runs its Playwright suite against its own preview port. The
      # packages run concurrently; unchanged suites replay from the
      # `.turbo` cache restored above.
      - run: pnpm run e2e
      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            packages/*/playwright-report
            packages/*/test-results
          if-no-files-found: ignore

  frameworks:
    name: Vite · Next · Remix compatibility
    needs: [commitlint]
    if: github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-playwright
        with:
          browsers: chromium
      - run: pnpm run test:frameworks
      - name: Upload compatibility reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: framework-compatibility-report
          path: |
            apps/compat-*/playwright-report
            apps/compat-*/test-results
          if-no-files-found: ignore
