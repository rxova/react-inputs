name: Storybook

# The storybook workshop is published at rxova.dev/storybook/react-inputs/ by
# the rxova/rxova-website aggregator, the same pipeline docs.yml feeds. Every
# project's workshop nests under /storybook/ — this one claims only its own
# subtree, so use-everywhere or any later project can publish alongside it.
# Unlike the docs it goes as schema 1: Storybook is a self-contained SPA with
# its own chrome, so the aggregator mounts the dist verbatim instead of
# composing it into the website shell. No base-path build flag is needed —
# Storybook emits `./` relative asset URLs, so the same dist works at any mount.
#
# Requires secret AGGREGATOR_DISPATCH_TOKEN (fine-grained PAT with Contents:
# write on rxova/rxova-website) — already present for docs.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialised rather than cancelled, for the same reason as docs.yml: the
# dispatch is the point, and two quick merges racing could notify the
# aggregator for builds that finished out of order.
concurrency:
  group: storybook-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: rxova/shared/actions/setup-pnpm@main
      - uses: rxova/shared/actions/turbo-cache@main
      - run: pnpm install --frozen-lockfile
      # A Turbo task: builds the component packages the stories import, then
      # runs `storybook build` in apps/storybook.
      - run: pnpm run storybook:build

      # `docs-dist` is the fixed artifact name in the ingest contract —
      # rxova-website's ingest.yml downloads it by that name from this run.
      # Pointing `path` at the dist itself keeps index.html at the artifact
      # root, which gate 2b checks.
      - name: Upload docs-dist
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: apps/storybook/dist
          if-no-files-found: error

      # Gate 1 of the ingest contract (rxova/rxova-website
      # docs/INPUTS-CONTRACT.md): tell rxova.dev this run holds a dist for
      # /storybook/react-inputs/. The aggregator validates, persists, and
      # republishes; a rejection leaves the live site untouched.
      #
      # A step rather than a job of its own, as in docs.yml.
      #
      # `project` is storybook-react-inputs — the id in the aggregator's
      # sources.json, a `kind: storybook` surface mounted at
      # /storybook/react-inputs/.
      - name: Dispatch storybook ingest to rxova.dev
        if: github.ref == 'refs/heads/main'
        uses: rxova/shared/actions/notify-website@main
        with:
          project: storybook-react-inputs
          base: /storybook/react-inputs/
          framework: storybook
          token: ${{ secrets.AGGREGATOR_DISPATCH_TOKEN }}
