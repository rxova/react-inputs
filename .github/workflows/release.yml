name: Release

# Runs only after CI has gone green on main. CI already runs the full ordered
# gate (lint, types, tests, coverage, e2e, package contract) on the exact commit
# being released, so re-running the whole suite here would just duplicate it —
# browsers and all. Gating on CI's success gives the same guarantee ("a push to
# main cannot publish something a PR would have been blocked on") without
# running the checks a second time.
#
# This file keeps its name: npm trusted publishing is bound to `release.yml`.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    # workflow_run fires on both success and failure; only release when CI
    # passed. Manual dispatch has no upstream run to gate on.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write # version commit and tags
      pull-requests: write # the version pull request
      id-token: write # npm trusted publishing (OIDC), with provenance
    # changesets/action opens the `chore: version packages` pull request, and
    # publishes once it is merged: `pnpm run release` builds every package
    # through Turbo, then `changeset publish`. Husky is off in the shared job,
    # so the version commit does not run the browser-backed pre-commit hook.
    uses: rxova/shared/.github/workflows/changesets-release.yml@main

  # Verifies the registry, rather than the workspace, after a publish: waits
  # until npm serves each version changesets/action reported, installs them
  # into a fresh project and imports every React package through ESM and
  # CommonJS (`repoConfig.postPublish` in the root package.json).
  post-publish-smoke:
    name: freshly published packages from npm
    needs: [release]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: rxova/shared/actions/setup-pnpm@main
      - run: pnpm install --frozen-lockfile
      - name: Verify freshly published packages from npm
        env:
          PUBLISHED_PACKAGES: ${{ needs.release.outputs.published-packages }}
        run: pnpm run postpublish:smoke
