name: Docs

# Docs are published as part of rxova.org (the rxova/rxova-website aggregator),
# not from this repo. The aggregator does not build them: this workflow builds
# the dist for /packages/react-inputs/, uploads it as the `docs-dist` artifact,
# and dispatches a `docs` event naming this run — gate 1 of the contract in
# rxova/rxova-website docs/INPUTS-CONTRACT.md. rxova.org validates what arrives,
# persists it, and republishes; a rejection leaves the live site untouched.
#
# Requires secret AGGREGATOR_DISPATCH_TOKEN (fine-grained PAT with Contents:
# write on rxova/rxova-website).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialised rather than cancelled: two quick merges to main would otherwise
# race, and the aggregator would be dispatched twice for builds that finished
# out of order. cancel-in-progress: false because the dispatch is the point —
# killing a run mid-flight can drop the notification entirely.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - uses: ./.github/actions/turbo-cache
      - run: pnpm install --frozen-lockfile
      # `docs:build` is a Turbo task: it builds the component packages first
      # (the docs import them for live examples), then runs the Astro/Starlight
      # build, which regenerates the TypeDoc API reference from source via
      # starlight-typedoc.
      #
      # DOCS_BASE_URL is what this build was missing: the aggregator only
      # relocates the tree, it never rewrites asset paths, so a dist built for
      # `/` 404s every stylesheet once mounted at /packages/react-inputs/. Both
      # vars are in the docs task's `env` (apps/docs/turbo.json), so this is a
      # distinct cache entry from the root-base build ci.yml does — no risk of
      # replaying a root build here.
      - name: Build docs at the aggregator base path
        env:
          DOCS_URL: https://rxova.org
          DOCS_BASE_URL: /packages/react-inputs/
        run: pnpm run docs:build

      - name: Mark the page-component bundle
        run: node apps/docs/scripts/write-page-bundle.mjs

      # The dist the aggregator will compose into its shell. `docs-dist` is the fixed
      # artifact name in the contract — ingest.yml downloads it by that name
      # from this run — so it is not ours to rename. Pointing `path` at the dist
      # directory (not its parent) is what puts index.html at the artifact root,
      # which is gate 2b's check.
      - name: Upload docs-dist
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: apps/docs/dist
          if-no-files-found: error

      # Gate 1 of the docs pipeline: tell rxova.org that this run holds a dist
      # built for /packages/react-inputs/. The aggregator validates the payload,
      # downloads the artifact above, and persists + publishes it — it never
      # builds these docs itself. Contract: rxova/rxova-website
      # docs/INPUTS-CONTRACT.md.
      #
      # A step rather than the `notify-website` job it replaces. That job made
      # one API call and was billed a whole minute for it, and it needed a
      # runner of its own only to depend on this one. `GITHUB_RUN_ID` is the
      # same either way, which is the only thing the contract reads.
      #
      # No continue-on-error, unlike the pre-contract dispatch this replaces.
      # Back then the aggregator rebuilt the docs from source on its own
      # schedule, so a dropped notification only delayed a publish. Now the
      # dispatch *is* the publish: swallowing a failure would leave the site
      # serving stale docs with a green tick here and nothing to look at.
      #
      # `-F` only for schema, which the receiver compares as the number 2;
      # everything else goes through `-f` so it stays a string, and an
      # all-digit ref or sha cannot arrive as a number.
      #
      # `project` is react-inputs — the id in the aggregator's sources.json,
      # which is the repo name, not the shorter package scope.
      - name: Dispatch docs ingest to rxova.org
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.AGGREGATOR_DISPATCH_TOKEN }}
        run: |
          gh api repos/rxova/rxova-website/dispatches \
            -f event_type=docs \
            -F 'client_payload[schema]=2' \
            -f 'client_payload[project]=react-inputs' \
            -f "client_payload[ref]=${GITHUB_REF_NAME}" \
            -f "client_payload[sha]=${GITHUB_SHA}" \
            -f "client_payload[run_id]=${GITHUB_RUN_ID}" \
            -f 'client_payload[base]=/packages/react-inputs/' \
            -f 'client_payload[framework]=astro'
