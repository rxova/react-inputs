name: PR title

# The squash-merge subject is the PR *title*: no commit in the branch contains
# it, and it can be changed after CI has already gone green. So it has to be
# checked, and it has to be re-checked on every edit.
#
# It lives here rather than in CI's `types:` because `edited` also fires on
# *body* edits, and there is no trigger-level way to tell the two apart. In CI
# that cost the entire graph: adding a cross-reference to a description
# cancelled the in-flight run and started a fresh one, and a cancelled job still
# bills its minute rounded up. Here the same edit costs one job doing one thing.
#
# Its own concurrency group, so re-titling can never cancel a CI run.

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: commit message (PR title)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile

      # Passed through the environment, never interpolated into the shell — a
      # title is attacker-controlled text.
      - name: Lint the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint --verbose
