name: 'Bug report'
description: 'Report a reproducible problem in an Rxova input package.'
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please identify the exact package and include the
        smallest reproduction that still shows the problem.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - '@rxova/react-intl-currency-input'
        - '@rxova/react-rating-input'
        - '@rxova/react-otp-input'
        - '@rxova/react-password-input'
        - '@rxova/react-phone-input'
        - '@rxova/react-date-input'
        - '@rxova/react-time-input'
        - '@rxova/react-tags-input'
        - '@rxova/react-file-input'
        - '@rxova/react-timezone-input'
        - '@rxova/react-inputs (meta-package)'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: '@rxova/react-date-input@x.y.z'
    validations:
      required: true
  - type: input
    id: react-version
    attributes:
      label: React version
      placeholder: '19.2.0'
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Where does it happen?
      options:
        - Browser (client render)
        - SSR / hydration
        - React Server Components
        - A test environment (jsdom, happy-dom, ...)
        - Build or type-checking
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How is it used?
      options:
        - Controlled (value + onChange)
        - Uncontrolled (defaultValue)
        - Inside a form library
        - The package hook directly
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, locale, writing direction, and assistive technology
      description: 'Include everything relevant; write “not applicable” for non-browser build issues.'
      placeholder: 'Safari 18, he-IL, RTL, VoiceOver'
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: 'A minimal snippet, or a link to a StackBlitz/CodeSandbox. `pnpm dev` in this repo runs a playground you can adapt.'
      render: tsx
    validations:
      required: true
  - type: checkboxes
    id: rtl
    attributes:
      label: Anything else applicable?
      options:
        - label: 'The page is right-to-left'
        - label: 'The user prefers reduced motion'
        - label: 'A strict Content Security Policy is in effect'
        - label: 'Custom `--rx-<component>-*` CSS variables are set'
